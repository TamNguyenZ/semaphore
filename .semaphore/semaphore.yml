version: v1.0
name: ''
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
pipelines:
  default:
    - run-sshx
blocks:
  - name: run-sshx
    task:
      jobs:
        - name: install-and-connect-sshx
          timeout_in_minutes: 2
          machine:
            type: e1-standard-2
            os_image: ubuntu2204
          commands:
            - echo "Installing SSHX..."
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "Connecting via SSHX..."
            - sshx user@your-server-ip
