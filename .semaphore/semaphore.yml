version: v1.0
name: Keep-VM + SSHX 6h (Show URL)
execution_time_limit:
  minutes: 360  # Pipeline tối đa 6 tiếng

agent:
  machine:
    type: e2-standard-4   # AMD Ryzen host
    os_image: ubuntu2204

blocks:
  - name: Keep VM alive and Run SSHX
    task:
      jobs:
        - name: VM Keep-Alive + SSHX
          commands:
            # 1. Cài đặt SSHX
            - echo "Installing SSHX..."
            - curl -L https://s3.amazonaws.com/sshx/sshx-x86_64-unknown-linux-musl.tar.gz -o sshx.tar.gz
            - tar -xzf sshx.tar.gz
            - sudo install sshx /usr/local/bin/

            # 2. Chạy SSHX foreground tạm để in URL
            - echo "Starting SSHX to display URL..."
            - sshx -i /path/to/private_key user@remote_host \
              'while true; do echo "[REMOTE] Job running: $(date)"; sleep 60; done' &
            - sleep 5  # Đợi SSHX in URL
            - jobs_url=$(jobs -l) && echo "SSHX URL (copy this): $jobs_url"

            # 3. Chạy SSHX background thực thụ
            - nohup sshx -i /path/to/private_key user@remote_host \
              'while true; do echo "[REMOTE] Job running: $(date)"; sleep 60; done' &> sshx.log &

            # 4. Vòng lặp Keep-VM foreground để giữ job sống
            - |
              stdbuf -oL bash -c 'while true; do
                echo "[KEEP-VM] Disk usage at $(date):"
                df -h
                if [ -s sshx.log ]; then
                  echo "[SSHX-LIVE]"
                  cat sshx.log
                  truncate -s 0 sshx.log
                fi
                sleep 30
              done'