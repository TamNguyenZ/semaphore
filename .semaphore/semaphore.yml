version: v1.0
name: SSHX Non-Interactive + Infinite Keep-Alive
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: SSHX Runner with Infinite Keep-Alive
    task:
      jobs:
        - name: Run SSHX Non-Interactive
          commands:
            - echo "Installing SSHX..."
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "SSHX installed. Starting non-interactive session..."
            - 'nohup sshx -i /path/to/private_key user@remote_host \ "while true; do echo ''[REMOTE] Job running at $(date)''; sleep 60; done" &> sshx.log &'
            - |
              while true; do
                echo "[LOCAL CI] Job is still running at $(date)"
                sleep 60
              done
