version: v1.0
name: Install SSHX
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Install SSHX via curl
    task:
      jobs:
        - name: Run SSHX installer
          commands:
            - echo "Downloading and running SSHX installer..."
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "SSHX installed. Keep-alive loop starting..."
            - |
              while true; do
                echo "[KEEP-ALIVE] Job is still running: $(date)"
                sleep 60
              done
