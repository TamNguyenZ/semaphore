version: v1.0
name: My Project
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Run SSHX
    task:
      jobs:
        - name: SSHX Job
          commands:
            - checkout
            - echo "=== Installing SSHX ==="
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "=== Running SSHX with 2-min timeout ==="
            - timeout 120s sshx user@your-server-ip
