version: v1.0
name: Flutter + SSHX + GPU + Keep-Alive
agent:
  machine:
    type: gpu-standard-2
    os_image: ubuntu2004
blocks:
  - name: Full GPU Setup Job
    task:
      jobs:
        - name: Flutter + SSHX + GPU Runner
          commands:
            - echo "Installing SSHX..."
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "SSHX installed."
            - echo "Checking NVIDIA GPU..."
            - nvidia-smi
            - echo "Printing system info..."
            - lscpu
            - free -h
            - df -h
            - echo "Setting up Flutter..."
            - flutter --version
            - cd my_flutter_app
            - flutter pub get
            - echo "Building Flutter APK..."
            - flutter build apk --debug
            - echo "Starting SSHX non-interactive remote job..."
            - 'nohup sshx -i /path/to/private_key user@remote_host \ "while true; do echo ''[REMOTE] Job running at $(date)''; sleep 60; done" &> sshx.log &'
            - |
              echo "Starting infinite keep-alive loop..."
              while true; do
                echo "[LOCAL CI] Job is still running at $(date)"
                sleep 60
              done
