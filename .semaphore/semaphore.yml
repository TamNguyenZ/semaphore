version: v1.0
name: SSHX Keep-Alive 24h
agent:
  machine:
    type: e2-standard-4
    os_image: ubuntu2204
blocks:
  - name: Install SSHX and Keep-Alive
    task:
      jobs:
        - name: SSHX Runner
          commands:
            - echo "Installing SSHX..."
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "SSHX installed. Starting non-interactive session..."
            - 'nohup sshx -i /path/to/private_key user@remote_host "while true; do echo ''[REMOTE] Job running: $(date)''; sleep 60; done" &> sshx.log &'
            - 'while true; do echo "[LOCAL CI] Job still running: $(date)"; sleep 60; done'
