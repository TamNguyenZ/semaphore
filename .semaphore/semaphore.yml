version: v1.0
name: My Project
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: run-sshx
    task:
      timeout_in_minutes: 2
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2204
      commands:
        - checkout
        - echo "Installing SSHX..."
        - 'curl -sSf https://sshx.io/get | sh -s run'
        - echo "Connecting via SSHX..."
        - sshx user@your-server-ip
      jobs: []
