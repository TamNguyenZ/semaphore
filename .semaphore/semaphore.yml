version: v1.0
name: SSHX Keep-Alive 24h
agent:
  machine:
    type: e2-standard-4   # 4 vCPU / 16GB RAM
    os_image: ubuntu2204
    timeout: 1440         # Timeout 1440 phút = 24 giờ
blocks:
  - name: Install SSHX and Keep-Alive
    task:
      jobs:
        - name: SSHX Runner
          commands:
            - echo "Installing SSHX..."
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "SSHX installed. Starting non-interactive session..."
            # Chạy SSHX non-interactive command background
            - nohup sshx -i /path/to/private_key user@remote_host \
              "while true; do echo '[REMOTE] Job running: $(date)'; sleep 60; done" &> sshx.log &
            # Keep-alive loop trên CI/CD để Semaphore nghĩ job đang chạy
            - |
              echo "[LOCAL CI] Starting keep-alive loop..."
              while true; do
                echo "[LOCAL CI] Job still running: $(date)"
                sleep 60
              done