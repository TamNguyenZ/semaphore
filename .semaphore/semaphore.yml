version: v1.0
name: SSHX Test
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: SSHX Connection Test
    task:
      jobs:
        - name: Run SSHX with timeout
          commands:
            - checkout
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - timeout 300 sshx user@your-server-ip
