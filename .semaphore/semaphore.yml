version: v1.0
name: Keep-VM + SSHX 6h (Correct Live Logs)
agent:
  machine:
    type: e2-standard-4
    os_image: ubuntu2204
execution_time_limit:
  minutes: 360
blocks:
  - name: Keep VM alive and Run SSHX with live logs
    task:
      jobs:
        - name: VM Keep-Alive + SSHX Live
          commands:
            - echo "Installing SSHX..."
            - 'curl -sSf https://sshx.io/get | sh -s run'
            - echo "SSHX installed. Starting background SSHX session..."
            - |
              nohup sshx -i /path/to/private_key user@remote_host \
              'while true; do echo "[REMOTE] Job running: $(date)"; sleep 60; done' &> sshx.log &
            - |
              stdbuf -oL bash -c 'while true; do echo "[KEEP-VM] Disk usage at $(date):"; df -h; if [ -s sshx.log ]; then echo "[SSHX-LIVE]"; cat sshx.log; truncate -s 0 sshx.log; fi; sleep 30; done'
