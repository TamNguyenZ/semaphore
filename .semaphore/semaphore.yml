version: v1.0
name: Keep-VM + SSHX 6h
agent:
  machine:
    type: e2-standard-4
    os_image: ubuntu2204
blocks:
  - name: Keep VM alive and Run SSHX
    task:
      jobs:
        - name: VM Keep-Alive + SSHX
          commands:
            - echo "Installing SSHX..."
            - 'curl -L https://s3.amazonaws.com/sshx/sshx-x86_64-unknown-linux-musl.tar.gz -o sshx.tar.gz'
            - tar -xzf sshx.tar.gz
            - sudo install sshx /usr/local/bin/
            - echo "SSHX installed. Starting background SSHX session..."
            - 'nohup sshx -i /path/to/private_key user@remote_host ''while true; do echo "[REMOTE] Job running: $(date)"; sleep 60; done'' > sshx.log 2>&1 &'
            - sleep 5
            - cat sshx.log
            - 'stdbuf -oL bash -c ''while true; do echo "[KEEP-VM] Disk usage at $(date):"; df -h; if [ -s sshx.log ]; then echo "[SSHX-LIVE]"; cat sshx.log; truncate -s 0 sshx.log; fi; sleep 30; done'''
